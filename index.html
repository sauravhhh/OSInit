<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10102a">
    <meta name="description" content="OSInit — free IP lookup. No API keys, works offline as a PWA.">
    <title>OSInit — Free IP Lookup</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #10102a;
            --panel: #1a1b3d;
            --panel2: #12132e;
            --ink: #f4f3ff;
            --muted: #8f8fc0;
            --teal: #2dd4bf;
            --red: #f87171;
            --radius: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 12px calc(18px + env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
        .hidden { display: none !important; }

        .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; align-self: flex-start; width: 100%; }
        .top img { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 4px 14px rgba(45,212,191,.3); }
        .top h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; flex: 1; }
        .top .sub { font-size: 11px; color: var(--muted); font-weight: 600; text-align: right; line-height: 1.4; }

        .tabs { display: flex; gap: 8px; width: 100%; margin-bottom: 14px; }
        .tab {
            flex: 1; border: 2px solid transparent; background: var(--panel); color: var(--muted);
            border-radius: 12px; padding: 10px 4px; cursor: pointer; font-family: inherit;
            font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
        }
        .tab .e { display: block; font-size: 20px; margin-bottom: 3px; }
        .tab.on { border-color: var(--teal); color: var(--ink); background: rgba(45,212,191,.08); }

        .searchrow { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }
        .searchrow input {
            flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
            background: var(--panel2); color: var(--ink); font-size: 16px; padding: 13px 14px;
            font-family: inherit; outline: none;
        }
        .searchrow input:focus { border-color: var(--teal); }
        .gobtn {
            flex: none; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, #2dd4bf, #0d9488); color: #04302b;
            font-size: 15px; font-weight: 800; padding: 0 20px; min-height: 50px;
        }
        .gobtn:active { transform: scale(.96); }
        .gobtn:disabled { opacity: .5; }

        .results { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .card {
            width: 100%; background: var(--panel); border-radius: var(--radius); padding: 14px;
        }
        .card h3 { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); margin-bottom: 10px; }
        .big { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
        .kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
        .kv:last-child { border-bottom: none; }
        .kv .k { color: var(--muted); font-weight: 600; flex: none; }
        .kv .v { text-align: right; font-weight: 700; word-break: break-word; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

        .profile { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
        .profile img { width: 58px; height: 58px; border-radius: 50%; background: var(--panel2); }
        .profile .pn { font-size: 17px; font-weight: 800; }
        .profile .pu { font-size: 13px; color: var(--muted); }
        .bio { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 6px; }
        .statrow { display: flex; gap: 8px; margin-top: 8px; }
        .stat { flex: 1; background: var(--panel2); border-radius: 10px; padding: 8px 4px; text-align: center; }
        .stat .n { font-size: 17px; font-weight: 800; }
        .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }

        .outlink {
            display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700;
            color: var(--teal); text-decoration: none; background: rgba(45,212,191,.1);
            padding: 8px 14px; border-radius: 10px;
        }
        .sublist { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .sublist .row { font-size: 13px; padding: 7px 10px; background: var(--panel2); border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; }
        .sublist .row .ip { color: var(--muted); font-size: 12px; }

        .spinner {
            width: 34px; height: 34px; margin: 26px auto; border-radius: 50%;
            border: 3px solid rgba(45,212,191,.2); border-top-color: var(--teal);
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .err {
            width: 100%; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.35);
            color: var(--red); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600;
            line-height: 1.5;
        }
        .note { font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center; margin-top: 6px; }
        .sources { font-size: 11px; color: var(--muted); opacity: .7; text-align: center; margin-top: 14px; line-height: 1.7; }
        footer { text-align: center; margin-top: 8px; font-size: 13px; color: var(--muted); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #23244d; color: var(--ink); font-size: 14px; font-weight: 700;
            padding: 12px 22px; border-radius: 24px; opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s; z-index: 50; white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,.5);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <img src="icon-192.png" alt="OSInit icon">
            <h1>OSInit</h1>
            <div class="sub">free IP<br>lookup</div>
        </div>

        <!-- IP -->
        <div class="tabpane wrap" id="pane-ip">
            <div class="searchrow">
                <input id="ipInput" inputmode="text" placeholder="8.8.8.8 — or tap My IP" autocomplete="off" autocapitalize="off" spellcheck="false">
                <button class="gobtn" id="ipGo">Go</button>
            </div>
            <div class="results" id="ipResults"></div>
            <div class="note">Leave empty and hit Go to look up your own IP.</div>
        </div>

        <div class="sources">IP lookup via ipapi.co — free, no key needed.</div>
        <footer>Made with ❤️ by Sauravhhh</footer>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        (function () {
            'use strict';

            var toast = document.getElementById('toast');
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(showToast.t);
                showToast.t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
            }

            function esc(s) {
                return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function flag(cc) {
                if (!cc || cc.length !== 2) return '';
                return String.fromCodePoint.apply(null, Array.prototype.map.call(cc.toUpperCase(), function (c) { return 127397 + c.charCodeAt(0); }));
            }

            function spinnerHTML() { return '<div class="spinner"></div>'; }
            function errHTML(msg) { return '<div class="err">' + esc(msg) + '</div>'; }

            function getJSON(url) {
                return fetch(url).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                });
            }

            // ================= IP =================
            var ipInput = document.getElementById('ipInput');
            var ipResults = document.getElementById('ipResults');
            var ipBusy = false;

            function ipCard(d) {
                var f = d.flag || {};
                var loc = [d.city, d.region, d.country].filter(Boolean).join(', ');
                var conn = d.connection || {};
                var tz = d.timezone || {};
                var html = '<div class="card"><h3>📍 IP Lookup</h3>' +
                    '<div class="big mono">' + esc(d.ip) + '</div>' +
                    '<div style="margin:6px 0 4px;font-size:15px;font-weight:700;">' + (f.emoji || flag(d.country_code)) + ' ' + esc(loc || 'Unknown location') + '</div>' +
                    kv('Type', d.type) +
                    kv('Coordinates', (d.latitude != null ? d.latitude.toFixed(4) + ', ' + d.longitude.toFixed(4) : '—')) +
                    kv('ISP', conn.isp || '—') +
                    kv('Organization', conn.org || '—') +
                    kv('ASN', conn.asn != null ? 'AS' + conn.asn : '—') +
                    kv('Timezone', tz.id ? tz.id + ' (' + tz.abbr + ', UTC' + tz.utc + ')' : '—') +
                    kv('Postal code', d.postal || '—') +
                    kv('Calling code', d.calling_code ? '+' + d.calling_code : '—');
                if (d.latitude != null) {
                    html += '<a class="outlink" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=' +
                        d.latitude + '&mlon=' + d.longitude + '#map=10/' + d.latitude + '/' + d.longitude + '">↗ Open in Maps</a>';
                }
                return html + '</div>';
            }
            function kv(k, v) {
                return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
            }

            function lookupIP(ip) {
                if (ipBusy) return;
                ipBusy = true;
                ipResults.innerHTML = spinnerHTML();
                var url = ip ? 'https://ipapi.co/' + encodeURIComponent(ip) + '/json/' : 'https://ipapi.co/json/';
                getJSON(url).then(function (d2) {
                    if (d2.error) throw new Error(d2.reason || 'Lookup failed');
                    return {
                        ip: d2.ip, success: true, type: d2.version,
                        city: d2.city, region: d2.region, country: d2.country_name,
                        country_code: d2.country_code, latitude: d2.latitude, longitude: d2.longitude,
                        postal: d2.postal, calling_code: d2.country_calling_code,
                        connection: { asn: (d2.asn || '').replace('AS', ''), org: d2.org, isp: d2.org },
                        timezone: { id: d2.timezone, abbr: '', utc: d2.utc_offset }, flag: {}
                    };
                }).then(function (d) {
                    ipResults.innerHTML = ipCard(d);
                }).catch(function (e) {
                    ipResults.innerHTML = errHTML('Could not look up that IP. Check the address and try again. (' + e.message + ')');
                }).then(function () { ipBusy = false; });
            }

            document.getElementById('ipGo').addEventListener('click', function () {
                var v = ipInput.value.trim();
                lookupIP(v);
            });
            ipInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('ipGo').click(); });

            // PWA service worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function (err) {
                        console.warn('SW registration failed:', err);
                    });
                });
            }
        })();
    </script>
</body>
</html>
